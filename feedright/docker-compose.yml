version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: feedright-db
    environment:
      POSTGRES_DB: feedright
      POSTGRES_USER: feedright_user
      POSTGRES_PASSWORD: feedright_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedright_user -d feedright"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
