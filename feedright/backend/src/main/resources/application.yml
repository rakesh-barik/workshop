spring:
  application:
    name: feedright-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/feedright
    username: feedright_user
    password: feedright_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# JWT Configuration
jwt:
  secret: feedright-secret-key-change-in-production-min-256-bits-required-for-hs256-algorithm
  expiration: 86400000  # 24 hours in milliseconds
